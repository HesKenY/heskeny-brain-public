<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BRAIN · Project Checklist</title>
<style>
  :root {
    --bg: #0b0d12;
    --bg-card: #121620;
    --bg-card-hover: #161b27;
    --border: #1f2533;
    --border-strong: #2a3344;
    --text: #d6dde9;
    --text-dim: #8993a8;
    --text-faint: #5b657a;
    --accent: #7ec8e8;
    --done: #6cc24a;
    --warn: #ffd819;
    --err: #ff5a2b;
    --paused: #c084fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    line-height: 1.4;
    height: 100%;
    overflow-x: hidden;
  }
  body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .head {
    position: sticky;
    top: 0;
    z-index: 5;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(11,13,18,0));
    padding: 10px 14px 8px;
    border-bottom: 1px solid var(--border);
  }
  .head-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .head h1 {
    margin: 0;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .head .meta {
    font-size: 11px;
    color: var(--text-faint);
  }
  .view-tabs {
    display: flex;
    gap: 4px;
    margin: 8px 0 6px;
  }
  .view-tab {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    font-family: inherit;
  }
  .view-tab.on {
    background: var(--bg-card);
    color: var(--text);
    border-color: var(--accent);
  }
  .totals {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .pill {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
    font-family: inherit;
  }
  .pill.static { cursor: default; }
  .pill strong { color: var(--text); font-weight: 600; }
  .pill.on {
    background: #1b2436;
    border-color: var(--accent);
    color: var(--text);
  }
  .pill.on.active   { border-color: var(--done);   background: #14241b; }
  .pill.on.planning { border-color: var(--warn);   background: #2a2615; }
  .pill.on.done     { border-color: var(--done);   background: #14241b; }
  .pill.on.on-hold  { border-color: var(--paused); background: #221b30; }
  .filter-clear {
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-faint);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  main { padding: 8px 10px 24px; }
  .group { margin-bottom: 14px; }
  .group-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 6px 6px 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 11px;
    margin-bottom: 6px;
  }
  .card-row1 {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .card-name {
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
  }
  .pct {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .status {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    vertical-align: middle;
  }
  .status.active { background: #1b3429; color: var(--done); }
  .status.planning { background: #2a2e1c; color: var(--warn); }
  .status.planned { background: #2a2e1c; color: var(--warn); }
  .status.on-hold { background: #2c2630; color: var(--paused); }
  .status.done { background: #1b3429; color: var(--done); }
  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 6px 0 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
  }
  .summary {
    color: var(--text-dim);
    font-size: 12px;
    margin: 0 0 4px;
  }
  .current {
    color: var(--text);
    font-size: 12px;
    margin: 0 0 6px;
  }
  .current::before {
    content: "now: ";
    color: var(--text-faint);
    text-transform: uppercase;
    font-size: 9px;
    letter-spacing: 0.08em;
    margin-right: 4px;
  }
  .next-list {
    margin: 4px 0 0;
    padding: 0 0 0 16px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .next-list li { margin: 1px 0; }
  .next-label, .meta-line {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-top: 4px;
  }
  .err-state {
    padding: 16px;
    color: var(--err);
    font-size: 12px;
  }
  .empty-state {
    padding: 24px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
  }
  /* Timeline view */
  .tl-day {
    margin: 6px 0 16px;
  }
  .tl-date {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    border-bottom: 1px dashed var(--border);
    padding: 0 4px 4px;
    margin-bottom: 6px;
    position: sticky;
    top: 0;
    background: var(--bg);
  }
  .tl-row {
    display: flex;
    gap: 10px;
    padding: 6px 6px;
    border-radius: 6px;
  }
  .tl-row:hover { background: var(--bg-card-hover); }
  .tl-icon {
    flex: 0 0 24px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
  }
  .today-card {
    background: linear-gradient(180deg, #14201a 0%, var(--bg-card) 70%);
    border: 1px solid var(--done);
    border-radius: 8px;
    padding: 10px 12px;
    margin: 0 0 12px;
  }
  .today-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
  }
  .today-head h2 {
    margin: 0; font-size: 13px; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--done);
  }
  .today-meta { font-size: 11px; color: var(--text-faint); }
  .today-row {
    display: flex; gap: 8px; padding: 4px 0;
    border-top: 1px dashed var(--border);
    font-size: 12px; color: var(--text);
  }
  .today-row:first-of-type { border-top: 0; }
  .today-row .kind {
    flex: 0 0 60px; font-size: 10px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-faint); padding-top: 2px;
  }
  .today-row .kind.shipped { color: var(--done); }
  .today-row .kind.decided { color: var(--accent); }
  .today-row .body { flex: 1; min-width: 0; }
  .today-row .body .ttl { font-weight: 600; }
  .today-row .body .sub { color: var(--text-dim); font-size: 11px; margin-top: 1px; }
  .today-empty { font-size: 12px; color: var(--text-faint); padding: 4px 0; }
  /* Roadmap + Projections views */
  .rm-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
  }
  .rm-section h3 {
    margin: 0 0 6px; font-size: 12px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-dim);
  }
  .rm-phase {
    border-left: 3px solid var(--border-strong);
    padding: 4px 10px; margin: 6px 0;
  }
  .rm-phase.now    { border-left-color: var(--done); }
  .rm-phase.next   { border-left-color: var(--accent); }
  .rm-phase.future { border-left-color: var(--paused); opacity: 0.92; }
  .rm-phase .when {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .rm-phase .ph-title { font-size: 13px; font-weight: 700; color: var(--text); margin: 1px 0; }
  .rm-phase .ph-sub   { font-size: 11px; color: var(--text-dim); }
  .rm-phase ul {
    margin: 4px 0 0 16px; padding: 0;
    color: var(--text-dim); font-size: 11px;
  }
  .rm-phase li { margin-bottom: 2px; }
  .pj-grid {
    display: grid;
    grid-template-columns: 110px 1fr 1fr 1fr;
    gap: 6px 10px;
    font-size: 11px; align-items: baseline;
  }
  .pj-grid .head {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-faint); border-bottom: 1px dashed var(--border); padding-bottom: 2px;
  }
  .pj-grid .ph     { font-weight: 600; color: var(--text); }
  .pj-grid .num    { font-variant-numeric: tabular-nums; }
  .pj-grid .num.cons { color: var(--text-dim); }
  .pj-grid .num.real { color: var(--accent); }
  .pj-grid .num.best { color: var(--done); }
  .pj-note { font-size: 11px; color: var(--text-faint); margin-top: 6px; }
  /* Index + Flow views (added 2026-04-26) */
  .ix-search {
    width: 100%; padding: 9px 12px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); border-radius: 7px;
    font-size: 13px; margin-bottom: 12px;
    font-family: inherit;
  }
  .ix-search:focus { outline: none; border-color: var(--accent); }
  .ix-section {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; margin-bottom: 10px;
  }
  .ix-section h3 {
    margin: 0 0 6px; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--accent);
  }
  .ix-row {
    display: grid; grid-template-columns: 100px 1fr;
    gap: 8px; padding: 4px 0;
    font-size: 12px;
    border-top: 1px dashed var(--border);
  }
  .ix-row:first-of-type { border-top: 0; }
  .ix-row .lbl { color: var(--text-faint); font-size: 11px; }
  .ix-row .val { color: var(--text); }
  .ix-row .val.kw { color: var(--accent); cursor: pointer; }
  .ix-corpus-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    font-size: 11px;
  }
  .ix-corpus-cell {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px;
  }
  .ix-corpus-cell .name { font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .ix-corpus-cell .num { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 16px; font-weight: 700; }
  .ix-corpus-cell .lbl { color: var(--text-faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  /* Flow view: project status diagram */
  .flow-board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
  }
  .flow-col {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px; min-height: 200px;
  }
  .flow-col h3 {
    margin: 0 0 8px; font-size: 11px; letter-spacing: 0.06em;
    text-transform: uppercase; padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .flow-col.col-active   h3 { color: var(--done); }
  .flow-col.col-planned  h3 { color: var(--accent); }
  .flow-col.col-blocked  h3 { color: var(--paused); }
  .flow-col.col-shipped  h3 { color: var(--text-dim); }
  .flow-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; margin-bottom: 6px;
    cursor: pointer; font-size: 11px;
  }
  .flow-card:hover { background: var(--bg-card-hover); border-color: var(--accent); }
  .flow-card .name { font-weight: 600; color: var(--text); }
  .flow-card .pct  { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .flow-arrow {
    text-align: center; color: var(--text-faint); font-size: 18px;
    padding: 4px 0;
  }
  /* System-flow diagram (boxes-and-arrows) */
  .sys-board { padding: 4px 0; }
  .sys-tier {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 6px;
  }
  .sys-tier .tier-label {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px; font-weight: 700;
  }
  .sys-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .sys-node {
    flex: 1; min-width: 130px;
    background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 8px 10px;
    font-size: 12px;
  }
  .sys-node .name { font-weight: 700; color: var(--text); }
  .sys-node .sub { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  .sys-node.live { border-color: var(--done); }
  .sys-node.live .name::after { content: " ●"; color: var(--done); }
  .sys-node.pending { border-color: var(--warn); opacity: 0.85; }
  .sys-node.pending .name::after { content: " ○"; color: var(--warn); }
  .sys-arrow {
    text-align: center; padding: 2px 0; color: var(--text-faint);
    font-size: 14px; font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .sys-legend {
    margin-top: 10px; padding: 8px; font-size: 11px; color: var(--text-faint);
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
  }
  .sys-legend strong { color: var(--text); }
  /* Current Idea view */
  .ci-card {
    background: linear-gradient(180deg, #1a1f2e 0%, var(--bg-card) 70%);
    border: 1px solid var(--accent);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .ci-card .ci-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; flex-wrap: wrap; margin-bottom: 6px;
  }
  .ci-card .ci-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 0; }
  .ci-card .ci-meta {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-faint);
  }
  .ci-card .ci-status {
    font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px;
  }
  .ci-card .ci-status.scoping { background: rgba(126, 200, 232, 0.14); color: var(--accent); }
  .ci-card .ci-status.active  { background: rgba(108, 194, 74, 0.14); color: var(--done); }
  .ci-card .ci-status.parked  { background: rgba(192, 132, 252, 0.14); color: var(--paused); }
  .ci-card .ci-summary { font-size: 12px; color: var(--text-dim); line-height: 1.5; margin: 4px 0 8px; }
  .ci-section {
    margin-top: 8px; padding-top: 6px;
    border-top: 1px dashed var(--border);
  }
  .ci-section-h {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 4px;
  }
  .ci-section ul { margin: 2px 0 0 18px; padding: 0; font-size: 12px; color: var(--text); }
  .ci-section ul li { margin-bottom: 2px; line-height: 1.4; }
  .ci-section ul li.muted { color: var(--text-dim); }
  .ci-model-grid {
    display: grid; gap: 8px; margin-top: 4px;
  }
  .ci-model {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px;
  }
  .ci-model .ci-model-name {
    font-size: 12px; font-weight: 700; color: var(--text);
  }
  .ci-model .ci-model-tag {
    font-size: 10px; letter-spacing: 0.04em; color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, monospace;
  }
  .ci-model .ci-model-role { font-size: 11px; color: var(--text-dim); margin-top: 3px; }
  .ci-model .ci-model-corpus { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
  .ci-mon-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .ci-mon-pill {
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
  }
  .tl-icon.shipped { background: #1b3429; color: var(--done); }
  .tl-icon.decided { background: #1b2436; color: var(--accent); }
  .tl-icon.planned { background: #2a2e1c; color: var(--warn); }
  .tl-icon.blocked { background: #2c2630; color: var(--paused); }
  .tl-body { flex: 1; min-width: 0; }
  .tl-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin: 0;
  }
  .tl-summary {
    font-size: 12px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }
  .tl-tag {
    font-size: 10px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-right: 6px;
  }
  /* Card click affordance */
  .card { cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .card:hover, .card:focus { background: var(--bg-card-hover); border-color: var(--border-strong); outline: none; }

  /* Detail overlay */
  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 13, 18, 0.78);
    backdrop-filter: blur(2px);
    z-index: 50;
    display: none;
    align-items: stretch;
    justify-content: center;
  }
  .detail-overlay.open { display: flex; }
  .detail-pane {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    width: min(680px, 100%);
    max-height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 0;
    padding: 16px 16px 32px;
    position: relative;
  }
  @media (min-width: 600px) {
    .detail-pane { border-radius: 10px; margin: 24px; max-height: calc(100vh - 48px); }
  }
  .detail-close {
    position: sticky;
    top: 0;
    float: right;
    background: var(--bg-card);
    color: var(--text-dim);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    z-index: 1;
  }
  .detail-close:hover { color: var(--text); }
  .detail-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin: 0 0 4px;
  }
  .detail-meta {
    color: var(--text-faint);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 8px;
  }
  .detail-section {
    margin-top: 14px;
  }
  .detail-section h3 {
    margin: 0 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    font-weight: 700;
  }
  .detail-section p {
    margin: 0 0 6px;
    color: var(--text);
    font-size: 13px;
  }
  .detail-section ul {
    margin: 4px 0;
    padding-left: 18px;
    color: var(--text);
    font-size: 13px;
  }
  .related-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .related-chip {
    background: #1b2436;
    color: var(--accent);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
  }
  .related-chip:hover { background: #243152; }

  /* Mini timeline inside detail pane */
  .detail-tl-row {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px dashed var(--border);
  }
  .detail-tl-row:first-child { border-top: 0; }
  .detail-tl-date {
    flex: 0 0 90px;
    font-size: 11px;
    color: var(--text-faint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 2px;
  }
  .detail-tl-body { flex: 1; min-width: 0; }
  .detail-tl-title {
    font-size: 13px;
    color: var(--text);
    margin: 0;
    font-weight: 600;
  }
  .detail-tl-summary {
    font-size: 12px;
    color: var(--text-dim);
    margin: 2px 0 0;
  }
  .detail-tl-kind {
    display: inline-block;
    padding: 0 6px;
    border-radius: 3px;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-right: 4px;
    vertical-align: 1px;
    font-weight: 700;
  }
  .detail-tl-kind.shipped { background: #1b3429; color: var(--done); }
  .detail-tl-kind.decided { background: #1b2436; color: var(--accent); }
  .detail-tl-kind.planned { background: #2a2e1c; color: var(--warn); }
  .detail-tl-kind.blocked { background: #2c2630; color: var(--paused); }

  @media (max-width: 380px) {
    body { font-size: 13px; }
    .card { padding: 8px 9px; }
    .card-name { font-size: 13px; }
    .detail-pane { padding: 12px 12px 24px; }
    .detail-tl-date { flex-basis: 80px; }
  }
</style>
</head>
<body>
  <div class="head">
    <div class="head-row">
      <h1>Project Checklist</h1>
      <span class="meta" id="stamp">loading…</span>
    </div>
    <div class="view-tabs">
      <button class="view-tab on" id="tab-projects" type="button">Projects</button>
      <button class="view-tab" id="tab-timeline" type="button">Timeline</button>
      <button class="view-tab" id="tab-roadmap" type="button">Roadmap</button>
      <button class="view-tab" id="tab-projections" type="button">Projections</button>
      <button class="view-tab" id="tab-current-idea" type="button">Current Idea</button>
      <button class="view-tab" id="tab-index" type="button">Index</button>
      <button class="view-tab" id="tab-flow" type="button">Flow</button>
      <button class="view-tab" id="tab-systemflow" type="button">System</button>
    </div>
    <div class="totals" id="totals"></div>
  </div>
  <main id="main">
    <div class="empty-state">Loading…</div>
  </main>

  <!-- Detail overlay — populated by openDetail(projectId) -->
  <div class="detail-overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-heading">
    <div class="detail-pane" id="detail-pane">
      <button class="detail-close" id="detail-close" type="button" aria-label="Close detail view">Close ✕</button>
      <div id="detail-body"></div>
    </div>
  </div>
  <script>
    window.CHECKLIST_DATA_URL = "./data/project-checklist.json";
    const API = (window.CHECKLIST_DATA_URL) || (location.protocol === 'file:' ? 'http://localhost:7777/api/project-checklist' : '/api/project-checklist');
    const TIMELINE_API = (window.TIMELINE_DATA_URL) || (location.protocol === 'file:' ? 'http://localhost:7777/api/timeline?limit=300' : '/api/timeline?limit=300');
    const POLL_MS = 30000;
    const FILTER_LS_KEY = 'checklist.filters.v1';
    const VIEW_LS_KEY = 'checklist.view.v1';
    const TL_SOURCES_LS_KEY = 'checklist.timeline.sources.v1';
    const $ = (id) => document.getElementById(id);
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // ── State ────────────────────────────────────────────────────────
    let _data = null;
    let _timeline = null; // unified events from /api/timeline (may be null if endpoint missing)
    const _filters = new Set(JSON.parse(localStorage.getItem(FILTER_LS_KEY) || '[]'));
    let _view = localStorage.getItem(VIEW_LS_KEY) || 'projects';
    // Default: show milestones + handoffs + dreams; logs/events off (chatty)
    const _tlSources = new Set(JSON.parse(
      localStorage.getItem(TL_SOURCES_LS_KEY) || '["milestone","handoff","dream"]'
    ));

    function saveFilters() { localStorage.setItem(FILTER_LS_KEY, JSON.stringify([...(_filters)])); }
    function saveView() { localStorage.setItem(VIEW_LS_KEY, _view); }
    function saveTlSources() { localStorage.setItem(TL_SOURCES_LS_KEY, JSON.stringify([...(_tlSources)])); }

    // ── Helpers ──────────────────────────────────────────────────────
    function flattenProjects(data) {
      const out = [];
      for (const g of data.groups || []) for (const p of (g.projects || [])) out.push({ ...p, _group: g });
      return out;
    }
    function statusBucket(p) {
      if (p.status === 'done' || p.percent >= 100) return 'done';
      if (p.status === 'active') return 'active';
      if (p.status === 'planning' || p.status === 'planned') return 'planning';
      if (p.status === 'on-hold') return 'on-hold';
      return p.status || 'other';
    }
    function projectMatchesFilter(p) {
      if (_filters.size === 0) return true;
      return _filters.has(statusBucket(p));
    }

    // ── Header pills (clickable filters) ─────────────────────────────
    function renderTotals() {
      if (!_data) return;
      const all = flattenProjects(_data);
      const total = all.length;
      const buckets = { active: 0, planning: 0, done: 0, 'on-hold': 0 };
      for (const p of all) {
        const b = statusBucket(p);
        if (buckets.hasOwnProperty(b)) buckets[b] += 1;
      }
      const sum = all.reduce((a, p) => a + (Number(p.percent) || 0), 0);
      const avg = total ? Math.round(sum / total) : 0;
      const milestonesCount = (_data.milestones || []).length;

      const pills = [];
      pills.push(`<button class="pill static" type="button" title="Average completion across all projects"><strong>${avg}%</strong> avg</button>`);
      for (const [bucket, count] of Object.entries(buckets)) {
        if (!count && !_filters.has(bucket)) continue;
        const on = _filters.has(bucket) ? ' on' : '';
        pills.push(`<button class="pill${on} ${bucket}" data-filter="${bucket}" type="button" title="Click to filter — ${bucket}"><strong>${count}</strong> ${bucket}</button>`);
      }
      pills.push(`<button class="pill static" type="button" title="Total projects in catalog"><strong>${total}</strong> total</button>`);
      pills.push(`<button class="pill static" type="button" title="Milestones tracked in timeline"><strong>${milestonesCount}</strong> milestones</button>`);
      if (_filters.size) {
        pills.push(`<button class="filter-clear" id="filter-clear" type="button" title="Clear all filters">clear</button>`);
      }
      $('totals').innerHTML = pills.join('');

      // Wire filter pills.
      $('totals').querySelectorAll('[data-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          const f = btn.dataset.filter;
          if (_filters.has(f)) _filters.delete(f); else _filters.add(f);
          saveFilters();
          render();
        });
      });
      const clr = $('filter-clear');
      if (clr) clr.addEventListener('click', () => { _filters.clear(); saveFilters(); render(); });
    }

    // ── Projects view ────────────────────────────────────────────────
    function renderProjectCard(p) {
      const pct = Math.max(0, Math.min(100, Number(p.percent) || 0));
      const nextItems = Array.isArray(p.next) ? p.next : [];
      const nextHtml = nextItems.length
        ? `<div class="next-label">next</div><ul class="next-list">${nextItems.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`
        : '';
      return `
        <div class="card" data-project-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Open detail for ${esc(p.name)}">
          <div class="card-row1">
            <span class="card-name">${esc(p.name)}<span class="status ${esc(p.status || '')}">${esc(p.status || '')}</span></span>
            <span class="pct">${pct}%</span>
          </div>
          <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
          ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ''}
          ${p.current ? `<p class="current">${esc(p.current)}</p>` : ''}
          ${nextHtml}
          ${p.owner ? `<div class="meta-line" style="margin-top:6px">owner · ${esc(p.owner)} · click for full timeline</div>` : '<div class="meta-line" style="margin-top:6px">click for full timeline</div>'}
        </div>`;
    }
    const TODAY_VISIBLE = 6;
    function renderTodayCard() {
      const today = new Date().toISOString().slice(0, 10);
      const items = (_data.milestones || [])
        .filter(m => (m.date || '').slice(0, 10) === today);
      const projects = new Set(items.map(m => m.project)).size;
      const shippedCount = items.filter(m => (m.kind || 'shipped') === 'shipped').length;
      const decidedCount = items.filter(m => m.kind === 'decided').length;
      const meta = items.length
        ? `${shippedCount} shipped · ${decidedCount} decided · ${projects} project${projects === 1 ? '' : 's'}`
        : 'no milestones logged yet today';
      const visible = items.slice(0, TODAY_VISIBLE);
      const hidden = Math.max(0, items.length - TODAY_VISIBLE);
      const rows = items.length
        ? visible.map(m => {
            const k = (m.kind || 'shipped').toLowerCase();
            const proj = esc(m.project || '');
            return `
              <div class="today-row">
                <div class="kind ${esc(k)}">${esc(k)}</div>
                <div class="body">
                  <div class="ttl">${esc(m.title || '')}</div>
                  <div class="sub">${proj} · ${esc((m.summary || '').slice(0, 140))}${(m.summary || '').length > 140 ? '…' : ''}</div>
                </div>
              </div>`;
          }).join('') + (hidden ? `<div class="today-empty">+ ${hidden} more — open Timeline for the full day.</div>` : '')
        : `<div class="today-empty">Day's still young — milestones will land here as they ship.</div>`;
      return `
        <div class="today-card">
          <div class="today-head">
            <h2>Today · ${esc(today)}</h2>
            <span class="today-meta">${esc(meta)}</span>
          </div>
          ${rows}
        </div>`;
    }

    function renderProjectsView() {
      const groups = (_data.groups || []).map(g => {
        const visible = (g.projects || []).filter(projectMatchesFilter);
        if (!visible.length) return '';
        return `
          <div class="group">
            <div class="group-title">
              <span class="group-dot" style="background:${esc(g.color || '#7ec8e8')}"></span>
              ${esc(g.title || g.id)}
            </div>
            ${visible.map(renderProjectCard).join('')}
          </div>`;
      }).join('');
      const todayHtml = renderTodayCard();
      const next = todayHtml + (groups || `<div class="empty-state">No projects match the active filter.</div>`);
      // Skip swap if content unchanged — eliminates the black-flash on
      // every 30s poll when nothing's actually moved.
      const mainEl = $('main');
      if (mainEl._lastHtml !== next) {
        mainEl.innerHTML = next;
        mainEl._lastHtml = next;
        wireCardClicks();
      }
    }

    function wireCardClicks() {
      $('main').querySelectorAll('[data-project-id]').forEach(el => {
        el.addEventListener('click', () => openDetail(el.dataset.projectId));
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(el.dataset.projectId); }
        });
      });
    }

    function findProjectById(id) {
      for (const g of (_data.groups || [])) {
        for (const p of (g.projects || [])) {
          if (p.id === id) return { project: p, group: g };
        }
      }
      return null;
    }

    // ── Detail modal: full project context + chronological timeline ──
    function openDetail(projectId) {
      const found = findProjectById(projectId);
      if (!found) return;
      const { project: p, group: g } = found;
      const pct = Math.max(0, Math.min(100, Number(p.percent) || 0));

      // Project's own milestones, oldest → newest (so the user sees the
      // growth path from inception to current state).
      const projectMilestones = (_data.milestones || [])
        .filter(m => m.project === p.id)
        .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

      const tlHtml = projectMilestones.length
        ? projectMilestones.map(m => {
            const k = (m.kind || 'shipped').toLowerCase();
            return `
              <div class="detail-tl-row">
                <div class="detail-tl-date">${esc(m.date || '')}</div>
                <div class="detail-tl-body">
                  <p class="detail-tl-title"><span class="detail-tl-kind ${esc(k)}">${esc(k)}</span>${esc(m.title)}</p>
                  ${m.summary ? `<p class="detail-tl-summary">${esc(m.summary)}</p>` : ''}
                </div>
              </div>`;
          }).join('')
        : `<p style="color:var(--text-faint);font-size:12px;font-style:italic">No milestones recorded yet for this project.</p>`;

      const related = Array.isArray(p.related) ? p.related : [];
      const relatedHtml = related.length
        ? related.map(rid => {
            const f = findProjectById(rid);
            const label = f ? f.project.name : rid;
            return `<button class="related-chip" data-related-id="${esc(rid)}" type="button">${esc(label)}</button>`;
          }).join('')
        : `<span style="color:var(--text-faint);font-size:11px;font-style:italic">No related projects linked yet.</span>`;

      const nextItems = Array.isArray(p.next) ? p.next : [];
      const nextHtml = nextItems.length
        ? `<ul>${nextItems.map(n => `<li>${esc(n)}</li>`).join('')}</ul>`
        : `<p style="color:var(--text-faint);font-size:12px;font-style:italic">No next steps recorded.</p>`;

      $('detail-body').innerHTML = `
        <h2 class="detail-title" id="detail-heading">${esc(p.name)}<span class="status ${esc(p.status || '')}" style="font-size:10px;margin-left:8px">${esc(p.status || '')}</span></h2>
        <p class="detail-meta">${esc(g.title || g.id)} · ${pct}% · owner ${esc(p.owner || 'unassigned')}</p>
        <div class="bar" style="margin:8px 0 0"><div class="bar-fill" style="width:${pct}%"></div></div>

        ${p.summary ? `<div class="detail-section"><h3>What this is</h3><p>${esc(p.summary)}</p></div>` : ''}
        ${p.current ? `<div class="detail-section"><h3>Where we are now</h3><p>${esc(p.current)}</p></div>` : ''}

        <div class="detail-section">
          <h3>Next steps</h3>
          ${nextHtml}
        </div>

        <div class="detail-section">
          <h3>Related projects</h3>
          <div class="related-chips">${relatedHtml}</div>
        </div>

        <div class="detail-section">
          <h3>Project timeline (${projectMilestones.length} milestone${projectMilestones.length === 1 ? '' : 's'})</h3>
          ${tlHtml}
        </div>
      `;

      // Wire related-chip clicks to swap the modal content.
      $('detail-body').querySelectorAll('[data-related-id]').forEach(btn => {
        btn.addEventListener('click', () => openDetail(btn.dataset.relatedId));
      });

      $('detail-overlay').classList.add('open');
      // Move keyboard focus into the modal for a11y; reset scroll.
      $('detail-pane').scrollTop = 0;
      $('detail-close').focus();
    }

    function closeDetail() {
      $('detail-overlay').classList.remove('open');
    }
    $('detail-close').addEventListener('click', closeDetail);
    $('detail-overlay').addEventListener('click', (e) => {
      if (e.target === $('detail-overlay')) closeDetail();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('detail-overlay').classList.contains('open')) closeDetail();
    });

    // ── Timeline view ────────────────────────────────────────────────
    function projectNameById(id) {
      for (const g of (_data.groups || [])) {
        for (const p of (g.projects || [])) {
          if (p.id === id) return p.name;
        }
      }
      return id;
    }
    // Source-tagged event icons + colors. Mirror the existing milestone
    // icon vocabulary so the unified feed reads consistently.
    const TL_SOURCE_META = {
      milestone: { glyph: '✓', label: 'milestone', color: '#6cc24a' },
      handoff:   { glyph: '⇄', label: 'handoff',   color: '#7ec8e8' },
      dream:     { glyph: '☾', label: 'dream',     color: '#c084fc' },
      event:     { glyph: '◉', label: 'event',     color: '#ffd819' },
      log:       { glyph: '·', label: 'log',       color: '#8993a8' },
    };
    const TL_SOURCES = ['milestone','handoff','dream','event','log'];

    function dayKey(ts) {
      // YYYY-MM-DD for grouping; cope with date-only milestone strings.
      if (!ts) return 'undated';
      return String(ts).slice(0, 10);
    }

    // ── Roadmap view ─────────────────────────────────────────────────
    // Cross-project roadmap: every project's `next` items as a phased
    // arc keyed by status. Active first, then planned, then completed/
    // paused. Operators can scan the whole BRAIN backlog at a glance.
    function renderRoadmapView() {
      const allProjects = [];
      for (const g of (_data.groups || [])) {
        for (const p of (g.projects || [])) {
          if (!projectMatchesFilter(p)) continue;
          allProjects.push({ ...p, group: g });
        }
      }
      const byStatus = (s) => allProjects.filter(p => (p.status || '').toLowerCase() === s);
      const active  = byStatus('active');
      const planned = byStatus('planned');
      const blocked = byStatus('blocked').concat(byStatus('paused'));

      function bucket(label, kind, list) {
        if (!list.length) return '';
        const phases = list.map(p => {
          const next = (p.next || []).slice(0, 4);
          const more = Math.max(0, (p.next || []).length - next.length);
          const ul = next.length
            ? `<ul>${next.map(n => `<li>${esc(n)}</li>`).join('')}${more ? `<li style="color:var(--text-faint)">+ ${more} more in detail view</li>` : ''}</ul>`
            : `<div class="ph-sub" style="font-style:italic">No queued next items.</div>`;
          return `
            <div class="rm-phase ${kind}" data-project-id="${esc(p.id)}" tabindex="0" role="button">
              <div class="when">${esc(p.group.title || p.group.id)} · ${esc(p.status || '')} · ${Number(p.percent) || 0}%</div>
              <div class="ph-title">${esc(p.name || p.id)}</div>
              <div class="ph-sub">${esc(p.summary || '')}</div>
              ${ul}
            </div>`;
        }).join('');
        return `<div class="rm-section"><h3>${esc(label)}</h3>${phases}</div>`;
      }

      const html =
        bucket(`Active (${active.length})`,  'now',    active) +
        bucket(`Planned (${planned.length})`, 'next',   planned) +
        bucket(`Blocked / Paused (${blocked.length})`, 'future', blocked);

      const mainEl = $('main');
      const next = html || `<div class="empty-state">No projects match the active filter.</div>`;
      if (mainEl._lastHtml !== next) {
        mainEl.innerHTML = next;
        mainEl._lastHtml = next;
        mainEl.querySelectorAll('[data-project-id]').forEach(el => {
          el.addEventListener('click', () => openDetail(el.dataset.projectId));
          el.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(el.dataset.projectId); }
          });
        });
      }
    }

    // ── Projections view ─────────────────────────────────────────────
    // Revenue + completion projections. Bug-Hunter is the only project
    // with quantified $ projections today; other projects show ETA-style
    // projections derived from `percent` + status.
    function renderProjectionsView() {
      // Bug-Hunter $ projections (sourced from widgets-bughunter.html roadmap).
      const bughunt = `
        <div class="rm-section">
          <h3>Bug Hunter — Revenue Pipeline (USD)</h3>
          <div class="pj-grid">
            <div class="head">Phase</div>
            <div class="head">Conservative</div>
            <div class="head">Realistic</div>
            <div class="head">Best</div>

            <div class="ph">Phase 1 · 4 drafted</div>
            <div class="num cons">$10K</div>
            <div class="num real">$35K</div>
            <div class="num best">$120K</div>

            <div class="ph">Phase 2 · queue + Azure</div>
            <div class="num cons">$5K</div>
            <div class="num real">$20K</div>
            <div class="num best">$80K</div>

            <div class="ph">Phase 3 · multi-cloud (annual)</div>
            <div class="num cons">$20K</div>
            <div class="num real">$80K</div>
            <div class="num best">$250K+</div>
          </div>
          <div class="pj-note">
            Conservative = floor × 25% accept-rate. Realistic = mid × 50%. Best = ceiling × accept-rate.
            Triage 7–60 days; payout 2–12 weeks. Phase 3 numbers are 12-month recurring once continuous-scan + AWS/GCP/Linux modules ship.
          </div>
        </div>`;

      // Sprint goal — Mon AM.
      const sprint = `
        <div class="rm-section">
          <h3>Sprint Goal · 2026-04-27 (Mon AM)</h3>
          <div class="pj-grid">
            <div class="head">Target</div>
            <div class="head">Now</div>
            <div class="head">Realistic by Mon</div>
            <div class="head">Stretch</div>

            <div class="ph">$ paid</div>
            <div class="num cons">$0</div>
            <div class="num real">$0–$500</div>
            <div class="num best">$5,000</div>

            <div class="ph">Packets submitted</div>
            <div class="num cons">0 / 4</div>
            <div class="num real">4 / 4</div>
            <div class="num best">10 / 10</div>
          </div>
          <div class="pj-note">
            Realistic read: triage cycles run days–weeks, so paid-by-Monday is a stretch. Path = max submission velocity now so pipeline weight is high when payouts land.
          </div>
        </div>`;

      // Cross-project completion projections (derived from percent + status).
      const allProjects = [];
      for (const g of (_data.groups || [])) {
        for (const p of (g.projects || [])) {
          if (!projectMatchesFilter(p)) continue;
          if ((p.status || '').toLowerCase() !== 'active') continue;
          allProjects.push({ ...p, group: g });
        }
      }
      allProjects.sort((a, b) => (Number(b.percent) || 0) - (Number(a.percent) || 0));
      const eta = (pct) => {
        if (pct >= 95) return 'this week';
        if (pct >= 75) return '1–2 weeks';
        if (pct >= 50) return '3–6 weeks';
        if (pct >= 25) return '6–12 weeks';
        return 'long-tail';
      };
      const projRows = allProjects.length
        ? allProjects.map(p => {
            const pct = Number(p.percent) || 0;
            return `
              <div class="ph">${esc(p.name || p.id)}</div>
              <div class="num cons">${pct}%</div>
              <div class="num real">${esc(eta(pct))}</div>
              <div class="num best">${esc((p.next || [])[0] || '—').slice(0, 60)}</div>`;
          }).join('')
        : '';
      const completion = projRows ? `
        <div class="rm-section">
          <h3>Active Projects — Completion ETA</h3>
          <div class="pj-grid">
            <div class="head">Project</div>
            <div class="head">Percent</div>
            <div class="head">ETA</div>
            <div class="head">Top next item</div>
            ${projRows}
          </div>
          <div class="pj-note">ETA buckets are heuristic — derived from the project percent. Actual ship dates depend on operator queue order.</div>
        </div>` : '';

      const mainEl = $('main');
      const next = sprint + bughunt + completion;
      if (mainEl._lastHtml !== next) {
        mainEl.innerHTML = next;
        mainEl._lastHtml = next;
      }
    }

    // ── Current Idea view ────────────────────────────────────────
    // Live snapshot of what's actively being thought through. Each
    // entry is a captured idea with its monetization / next steps /
    // status. Sourced from /api/project-checklist `current_ideas[]`.
    function renderCurrentIdeaView() {
      const ideas = (_data && _data.current_ideas) || [];
      const mainEl = $('main');
      if (!ideas.length) {
        const next = '<div class="empty-state">No current ideas captured yet — they appear here as Ken sketches new directions.</div>';
        if (mainEl._lastHtml !== next) { mainEl.innerHTML = next; mainEl._lastHtml = next; }
        return;
      }
      const html = ideas.map(function (idea) {
        const status = String(idea.status || 'scoping').toLowerCase();
        const sections = [];

        if (idea.summary) {
          sections.push('<div class="ci-summary">' + esc(idea.summary) + '</div>');

    // ── Index view ────────────────────────────────────────────────
    // Searchable cross-cut over projects + milestones + current_ideas
    // + corpus stats. Type into the box; rows filter live by substring
    // across all titles, summaries, project ids, and idea fields.
    let _ixQuery = '';
    function renderIndexView() {
      const q = _ixQuery.toLowerCase().trim();
      const matches = (s) => !q || (String(s || '').toLowerCase().includes(q));
      const projects = [];
      for (const g of (_data.groups || [])) {
        for (const p of (g.projects || [])) projects.push({ ...p, group: g.title || g.id });
      }
      const matchedProjects = projects.filter(p =>
        matches(p.id) || matches(p.name) || matches(p.summary) || matches(p.current) || matches(p.group)
      );
      const matchedMilestones = (_data.milestones || []).filter(m =>
        matches(m.title) || matches(m.summary) || matches(m.project) || matches(m.kind) || matches(m.date)
      );
      const matchedIdeas = (_data.current_ideas || []).filter(idea =>
        matches(idea.id) || matches(idea.title) || matches(idea.summary) ||
        (idea.next || []).some(n => matches(n))
      );

      // Corpus stats — try to fetch counts from the seeds dirs (best-
      // effort; no API for this so we show static placeholders the
      // operator can refresh manually).
      const corpusPromise = (async () => {
        try {
          const r = await fetch('/api/seeds-summary', { cache: 'no-store' });
          if (r.ok) return await r.json();
        } catch (e) {}
        return null;
      })();

      const html = `
        <input class="ix-search" id="ix-search" placeholder="Search projects, milestones, ideas, lessons…" value="${esc(_ixQuery)}">
        <div class="ix-section">
          <h3>Projects (${matchedProjects.length})</h3>
          ${matchedProjects.length ? matchedProjects.map(p => `
            <div class="ix-row">
              <span class="lbl">${esc(p.status || '?')}/${(Number(p.percent) || 0)}%</span>
              <span class="val kw" data-project-id="${esc(p.id)}">${esc(p.name || p.id)} <span class="lbl">— ${esc(p.group)}</span></span>
            </div>
          `).join('') : '<div class="lbl">No matches.</div>'}
        </div>
        <div class="ix-section">
          <h3>Milestones (${matchedMilestones.length})</h3>
          ${matchedMilestones.slice(0, 30).map(m => `
            <div class="ix-row">
              <span class="lbl">${esc(m.date || '')} ${esc(m.kind || '')}</span>
              <span class="val">${esc(m.title || '')} <span class="lbl">— ${esc(m.project || '?')}</span></span>
            </div>

          ${matchedMilestones.length > 30 ? `<div class="lbl" style="margin-top:6px">+ ${matchedMilestones.length - 30} more — narrow the search</div>` : ''}
        </div>
        <div class="ix-section">
          <h3>Current Ideas (${matchedIdeas.length})</h3>
          ${matchedIdeas.length ? matchedIdeas.map(idea => `
            <div class="ix-row">
              <span class="lbl">${esc(idea.captured || '')} ${esc(idea.status || '')}</span>
              <span class="val">${esc(idea.title || idea.id)} <span class="lbl">${(idea.next || []).length} next-items</span></span>
            </div>
          `).join('') : '<div class="lbl">No matches.</div>'}
        </div>
        <div class="ix-section" id="ix-corpus">
          <h3>KenAI Corpus / RAG Surfaces</h3>
          <div class="ix-corpus-grid">
            <div class="ix-corpus-cell"><div class="name">kenai-v5</div><div class="lbl">offline-dev primary</div><div class="num" id="cnum-v5">…</div></div>
            <div class="ix-corpus-cell"><div class="name">kenai-trainer</div><div class="lbl">Pokémon arc</div><div class="num" id="cnum-trainer">…</div></div>
            <div class="ix-corpus-cell"><div class="name">kenai-deep</div><div class="lbl">deeper reasoning</div><div class="num" id="cnum-deep">…</div></div>
          </div>
          <div class="lbl" style="margin-top:6px">Counts = approved seeds per model (corpus-isolation directive). RAG sources: peerlog (8,143 rows), dreams, manual seeds, bug-hunt findings, operator-walk lessons.</div>
        </div>
      `;
      const mainEl = $('main');
      if (mainEl._lastHtml !== html) {
        mainEl.innerHTML = html;
        mainEl._lastHtml = html;
        $('ix-search').addEventListener('input', (ev) => {
          _ixQuery = ev.target.value;
          renderIndexView();
          // Restore caret to keep typing smooth.
          requestAnimationFrame(() => {
            const s = $('ix-search');
            if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
          });
        });
        mainEl.querySelectorAll('[data-project-id]').forEach(el => {
          el.addEventListener('click', () => openDetail(el.dataset.projectId));
        });
        // Best-effort corpus count fetch — no error if absent.
        corpusPromise.then(d => {
          if (!d) return;
          const v = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n; };
          v('cnum-v5',      (d['kenai-v5'] || {}).approved || '?');
          v('cnum-trainer', (d['kenai-trainer'] || {}).approved || '?');
          v('cnum-deep',    (d['kenai-deep'] || {}).approved || '?');
        });
      }
    }

    // → Blocked → Shipped. Each card is clickable into the project
    // detail. Visualizes where work-in-flight sits in the pipeline.
    function renderFlowView() {

              <div class="pct">${(Number(p.percent) || 0)}% · ${esc(p.group)}</div>

      const html = `
        <div class="flow-board">
          ${renderCol('active', '⚡ Active')}

        mainEl._lastHtml = html;
        mainEl.querySelectorAll('[data-project-id]').forEach(el => {

    function renderTimelineSourcePills() {
      // Per-source toggle pills above the timeline. Backed by counts
      // returned in the /api/timeline response (or zeros when the
      // endpoint isn't reachable yet).
      const counts = (_timeline && _timeline.counts) || {};
      const pills = TL_SOURCES.map(src => {
        const meta = TL_SOURCE_META[src];
        const on = _tlSources.has(src);
        const cls = on ? 'pill on' : 'pill';
        const c = counts[src] || 0;
        return `<button class="${cls}" data-tl-source="${src}" type="button" title="Toggle ${meta.label}" style="border-color:${meta.color}33${on ? `;background:${meta.color}1a` : ''}">
          <strong style="color:${meta.color}">${c}</strong> ${meta.label}
        </button>`;
      });
      if (_timeline === null) {
        pills.push(`<span class="meta" style="color:var(--text-faint);font-size:11px;align-self:center">timeline endpoint offline — showing milestones only</span>`);
      }
      return `<div class="totals" style="margin:6px 0 8px">${pills.join('')}</div>`;
    }

    function renderTimelineView() {
      // Use the unified /api/timeline feed when available; fall back to
      // the legacy milestones-only feed if the endpoint hasn't shipped
      // yet (server.js needs a restart after the endpoint addition).
      let events;
      if (_timeline && Array.isArray(_timeline.events)) {
        events = _timeline.events.filter(e => _tlSources.has(e.source));
      } else {
        events = (_data.milestones || []).slice()
          .sort((a, b) => (b.date || '').localeCompare(a.date || ''))
          .map(m => ({
            ts: `${m.date || ''}T00:00:00Z`,
            source: 'milestone',
            kind: m.kind || 'shipped',
            project: m.project,
            title: m.title || '',
            body: m.summary || '',
            _milestoneRef: m,
          }));
      }

      const sourcePills = renderTimelineSourcePills();

      if (!events.length) {
        $('main').innerHTML = sourcePills + `<div class="empty-state">No events match the active filter.</div>`;
        wireTimelineSourcePills();
        return;
      }

      // Group by day (YYYY-MM-DD)
      const byDate = new Map();
      for (const e of events) {
        const d = dayKey(e.ts);
        if (!byDate.has(d)) byDate.set(d, []);
        byDate.get(d).push(e);
      }

      const html = sourcePills + [...byDate.entries()].map(([date, rows]) => {
        const items = rows.map((e) => {
          const meta = TL_SOURCE_META[e.source] || TL_SOURCE_META.log;
          const proj = e.project ? `<span class="tl-tag">${esc(projectNameById(e.project))}</span>` : '';
          const tag = `<span class="tl-tag" style="background:${meta.color}22;color:${meta.color}">${esc(e.source)}</span>`;
          // Hover/title shows full body for log lines so they're readable
          // without expanding the layout.
          const titleAttr = e.body ? ` title="${esc(e.body)}"` : '';
          // Click-through only for milestones (open detail modal); other
          // sources show inline only — no modal yet.
          const isMs = e.source === 'milestone';
          // Try to resolve milestone idx for click-through.
          let attr = `tabindex="0" role="button"${titleAttr}`;
          if (isMs) {
            const idx = (_data.milestones || []).findIndex(m =>
              m.title === e.title && (m.date === (e.ts || '').slice(0,10)));
            if (idx >= 0) attr = `data-milestone-idx="${idx}" ${attr} aria-label="Open milestone detail: ${esc(e.title)}"`;
          }
          const k = (e.kind || '').toLowerCase();
          return `
            <div class="tl-row" ${attr}>
              <div class="tl-icon ${esc(k)}" style="background:${meta.color}33;color:${meta.color}">${meta.glyph}</div>
              <div class="tl-body">
                <p class="tl-title">${tag}${proj}${esc(e.title)}</p>
                ${e.body && e.source !== 'log' ? `<p class="tl-summary">${esc(e.body).slice(0, 280)}</p>` : ''}
              </div>
            </div>`;
        }).join('');
        return `<div class="tl-day"><div class="tl-date">${esc(date)}</div>${items}</div>`;
      }).join('');

      const mainEl = $('main');
      if (mainEl._lastHtml !== html) {
        mainEl.innerHTML = html;
        mainEl._lastHtml = html;
        wireMilestoneClicks();
        wireTimelineSourcePills();
      }
    }

    function wireTimelineSourcePills() {
      document.querySelectorAll('[data-tl-source]').forEach(btn => {
        btn.addEventListener('click', () => {
          const src = btn.dataset.tlSource;
          if (_tlSources.has(src)) _tlSources.delete(src);
          else _tlSources.add(src);
          saveTlSources();
          renderTimelineView();
        });
      });
    }

    function wireMilestoneClicks() {
      $('main').querySelectorAll('[data-milestone-idx]').forEach(el => {
        const idx = Number(el.dataset.milestoneIdx);
        el.addEventListener('click', () => openMilestoneDetail(idx));
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMilestoneDetail(idx); }
        });
      });
    }

    // Detail modal for a single milestone — title + summary + jump to
    // its project + the project's full mini-timeline so the operator
    // sees what was happening before and after.
    function openMilestoneDetail(idx) {
      const m = (_data.milestones || [])[idx];
      if (!m) return;
      const k = (m.kind || 'shipped').toLowerCase();
      const projInfo = m.project ? findProjectById(m.project) : null;
      const projName = projInfo ? projInfo.project.name : (m.project || 'unassigned');

      const projectMilestones = m.project
        ? (_data.milestones || [])
            .map((row, i) => ({ row, i }))
            .filter(({ row }) => row.project === m.project)
            .sort((a, b) => (a.row.date || '').localeCompare(b.row.date || ''))
        : [];

      const tlHtml = projectMilestones.map(({ row, i }) => {
        const rk = (row.kind || 'shipped').toLowerCase();
        const isThis = i === idx;
        const highlight = isThis ? 'style="background:#1b2436;border-radius:6px"' : '';
        return `
          <div class="detail-tl-row" ${highlight} data-jump-idx="${i}" tabindex="0" role="button">
            <div class="detail-tl-date">${esc(row.date || '')}</div>
            <div class="detail-tl-body">
              <p class="detail-tl-title"><span class="detail-tl-kind ${esc(rk)}">${esc(rk)}</span>${esc(row.title)}${isThis ? ' ← this' : ''}</p>
              ${row.summary ? `<p class="detail-tl-summary">${esc(row.summary)}</p>` : ''}
            </div>
          </div>`;
      }).join('');

      const projectButton = m.project
        ? `<button class="related-chip" data-jump-project="${esc(m.project)}" type="button">Open ${esc(projName)} →</button>`
        : '';

      $('detail-body').innerHTML = `
        <h2 class="detail-title" id="detail-heading"><span class="detail-tl-kind ${esc(k)}" style="vertical-align:3px;margin-right:8px">${esc(k)}</span>${esc(m.title)}</h2>
        <p class="detail-meta">${esc(m.date || '')} · ${esc(projName)}</p>

        ${m.summary ? `<div class="detail-section"><h3>What landed</h3><p>${esc(m.summary)}</p></div>` : ''}

        ${m.project ? `<div class="detail-section"><h3>Project</h3><div class="related-chips">${projectButton}</div></div>` : ''}

        ${projectMilestones.length > 1 ? `
          <div class="detail-section">
            <h3>How this project grew (${projectMilestones.length} milestones)</h3>
            ${tlHtml}
          </div>` : ''}
      `;

      // Wire jumps: project chip opens project detail; mini-timeline
      // rows open the milestone they represent.
      const pjBtn = $('detail-body').querySelector('[data-jump-project]');
      if (pjBtn) pjBtn.addEventListener('click', () => openDetail(pjBtn.dataset.jumpProject));
      $('detail-body').querySelectorAll('[data-jump-idx]').forEach(row => {
        const j = Number(row.dataset.jumpIdx);
        if (j === idx) return; // current row, no-op
        row.addEventListener('click', () => openMilestoneDetail(j));
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openMilestoneDetail(j); }
        });
      });

      $('detail-overlay').classList.add('open');
      $('detail-pane').scrollTop = 0;
      $('detail-close').focus();
    }

    // ── Top-level render + view tabs ─────────────────────────────────
    function render() {
      if (!_data) return;
      renderTotals();
      if (_view === 'timeline') renderTimelineView();
      else if (_view === 'roadmap') renderRoadmapView();
      else if (_view === 'projections') renderProjectionsView();
      else if (_view === 'current-idea') renderCurrentIdeaView();
      else if (_view === 'index') renderIndexView();
      else if (_view === 'flow') renderFlowView();
      else if (_view === 'systemflow') renderSystemFlowView();
      else renderProjectsView();
      $('tab-projects').classList.toggle('on', _view === 'projects');
      $('tab-timeline').classList.toggle('on', _view === 'timeline');
      $('tab-roadmap').classList.toggle('on', _view === 'roadmap');
      $('tab-projections').classList.toggle('on', _view === 'projections');
      $('tab-current-idea').classList.toggle('on', _view === 'current-idea');
      $('tab-index').classList.toggle('on', _view === 'index');
      $('tab-flow').classList.toggle('on', _view === 'flow');
      $('tab-systemflow').classList.toggle('on', _view === 'systemflow');
      const stamp = _data.last_updated_iso ? new Date(_data.last_updated_iso) : null;
      const updated = _data.updated ? `edited ${_data.updated}` : '';
      const fresh = stamp ? `synced ${stamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}` : '';
      $('stamp').textContent = [updated, fresh].filter(Boolean).join(' · ');
    }

    $('tab-projects').addEventListener('click', () => { _view = 'projects'; saveView(); render(); });
    $('tab-timeline').addEventListener('click', () => { _view = 'timeline'; saveView(); render(); });
    $('tab-roadmap').addEventListener('click', () => { _view = 'roadmap'; saveView(); render(); });
    $('tab-projections').addEventListener('click', () => { _view = 'projections'; saveView(); render(); });
    $('tab-current-idea').addEventListener('click', () => { _view = 'current-idea'; saveView(); render(); });
    $('tab-index').addEventListener('click', () => { _view = 'index'; saveView(); render(); });
    $('tab-flow').addEventListener('click', () => { _view = 'flow'; saveView(); render(); });
    $('tab-systemflow').addEventListener('click', () => { _view = 'systemflow'; saveView(); render(); });

    async function loadTimeline() {
      // Best-effort fetch of /api/timeline. Failures are non-fatal —
      // the Timeline view falls back to milestones-only when _timeline
      // is null.
      try {
        const r = await fetch(TIMELINE_API, { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        _timeline = await r.json();
      } catch (e) {
        _timeline = null;
      }
    }

    async function load() {
      try {
        const [checklistRes] = await Promise.all([
          fetch(API, { cache: 'no-store' }),
          loadTimeline(),
        ]);
        if (!checklistRes.ok) throw new Error(`HTTP ${checklistRes.status}`);
        _data = await checklistRes.json();
        render();
      } catch (e) {
        $('main').innerHTML = `<div class="err-state">Could not load checklist: ${esc(e.message)}<br><br>Set <code>window.CHECKLIST_DATA_URL</code> if you're hosting this offsite.</div>`;
        $('stamp').textContent = 'error';
      }
    }

    load();
    setInterval(load, POLL_MS);
  </script>
</body>
</html>
